<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Success</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(rgba(20, 20, 31, .7), rgba(20, 20, 31, .7)), url(bg-hero.jpg);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            min-height: 100vh;
        }
        .success-container {
            max-width: 600px;
            width: 90%;
            margin: 2rem auto;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen py-8">
    <div class="success-container">
        <div class="bg-white p-10 rounded-xl shadow-2xl border-2 border-green-500 text-center">
            <svg class="w-16 h-16 text-green-500 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
            </svg>
            <h1 class="text-3xl font-bold mb-4 text-green-700">Booking Successful!</h1>
            <p class="text-green-700 mb-2">Thank you for your payment.</p>
            <p class="text-green-700 font-semibold text-lg mb-4">Transaction ID: <span id="transaction-id" class="font-bold"></span></p>
            <a href="booking.html" class="w-full bg-green-600 text-white py-3 rounded-lg text-lg font-semibold hover:bg-green-700 transform hover:scale-105 transition-all duration-200 inline-block mt-4">Make Another Booking</a>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const transactionId = urlParams.get('transaction_id');

            if (!transactionId) {
                window.location.href = 'booking.html';
                return;
            }

            document.getElementById('transaction-id').textContent = transactionId;
        });
    </script>
</body>
</html>

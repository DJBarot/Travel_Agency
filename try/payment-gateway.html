<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Gateway</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(rgba(20, 20, 31, .7), rgba(20, 20, 31, .7)), url(bg-hero.jpg);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            min-height: 100vh;
        }
        .payment-container {
            max-width: 800px;
            width: 90%;
            margin: 2rem auto;
        }
        .payment-info {
            font-size: 1.1rem;
            line-height: 2;
        }
        .payment-option {
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .payment-option.active {
            border-color: #10B981;
            background-color: #ECFDF5;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen py-8">
    <div class="payment-container">
        <div class="bg-white p-10 rounded-xl shadow-2xl border-2 border-green-500">
            <h1 class="text-3xl font-bold mb-8 text-green-600 text-center">Complete Your Payment</h1>
            
            <!-- Booking Summary -->
            <div id="booking-summary" class="mb-8">
                <h2 class="text-xl font-bold mb-4 text-green-700">Booking Summary</h2>
                <div class="bg-green-50 p-6 rounded-lg">
                    <p><span class="font-semibold text-green-700">Vehicle Type:</span> <span id="summary-vehicle-type"></span></p>
                    <p><span class="font-semibold text-green-700">Vehicle Model:</span> <span id="summary-vehicle-model"></span></p>
                    <p><span class="font-semibold text-green-700">Rental Period:</span> <span id="summary-rental-period"></span></p>
                    <p><span class="font-semibold text-green-700">Duration:</span> <span id="summary-duration"></span> days</p>
                    <div id="price-breakdown" class="mt-4"></div>
                    <p class="text-xl mt-4"><span class="font-bold text-green-700">Total Price:</span> ₹<span id="total-cost">0.00</span></p>
                </div>
            </div>

            <!-- Payment Form -->
            <form id="payment-form" class="space-y-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-3">Payment Method</label>
                    <div class="grid grid-cols-3 gap-4">
                        <div id="card-option" class="payment-option active border-2 p-4 rounded-lg text-center">
                            <svg class="w-6 h-6 mx-auto mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"></path>
                            </svg>
                            <span>Card</span>
                            <input type="radio" name="payment_method" value="card" class="hidden" checked>
                        </div>
                        <div id="upi-option" class="payment-option border-2 p-4 rounded-lg text-center">
                            <svg class="w-6 h-6 mx-auto mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"></path>
                            </svg>
                            <span>UPI</span>
                            <input type="radio" name="payment_method" value="upi" class="hidden">
                        </div>
                        <div id="wallet-option" class="payment-option border-2 p-4 rounded-lg text-center">
                            <svg class="w-6 h-6 mx-auto mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2z"></path>
                            </svg>
                            <span>Wallet</span>
                            <input type="radio" name="payment_method" value="wallet" class="hidden">
                        </div>
                    </div>
                </div>

                <!-- Card Payment Fields -->
                <div id="card-payment-fields" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Card Number</label>
                        <input type="text" name="card_number" class="w-full px-3 py-2 border border-gray-300 rounded-md" placeholder="1234 5678 9012 3456">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Card Holder Name</label>
                        <input type="text" name="card_name" class="w-full px-3 py-2 border border-gray-300 rounded-md" placeholder="John Doe">
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Expiry Date</label>
                            <input type="text" name="expiry_date" class="w-full px-3 py-2 border border-gray-300 rounded-md" placeholder="MM/YY">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">CVV</label>
                            <input type="text" name="cvv" class="w-full px-3 py-2 border border-gray-300 rounded-md" placeholder="123">
                        </div>
                    </div>
                </div>

                <!-- UPI Payment Fields -->
                <div id="upi-payment-fields" class="space-y-4 hidden">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">UPI ID</label>
                        <input type="text" name="upi_id" class="w-full px-3 py-2 border border-gray-300 rounded-md" placeholder="example@upi">
                    </div>
                </div>

                <!-- Wallet Payment Fields -->
                <div id="wallet-payment-fields" class="space-y-4 hidden">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Wallet Type</label>
                        <select name="wallet_type" class="w-full px-3 py-2 border border-gray-300 rounded-md">
                            <option value="paytm">Paytm</option>
                            <option value="phonepe">PhonePe</option>
                            <option value="googlepay">Google Pay</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Mobile Number</label>
                        <input type="text" name="wallet_mobile" class="w-full px-3 py-2 border border-gray-300 rounded-md" placeholder="9876543210">
                    </div>
                </div>

                <button type="submit" class="w-full bg-green-600 text-white py-3 rounded-lg text-lg font-semibold hover:bg-green-700 transform hover:scale-105 transition-all duration-200">
                    Pay ₹<span id="pay-button-amount">0.00</span>
                </button>
            </form>

            <!-- Payment Processing Modal -->
            <div id="payment-processing-modal" class="hidden fixed inset-0 bg-gray-800 bg-opacity-75 flex items-center justify-center z-50">
                <div class="bg-white p-8 rounded-lg text-center">
                    <svg class="animate-spin h-10 w-10 text-green-500 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v4m0 8v4m8-8h-4m-8 0H4m16 0a8 8 0 11-16 0 8 8 0 0116 0z"></path>
                    </svg>
                    <p class="text-lg font-semibold text-green-700">Processing your payment...</p>
                </div>
            </div>

            <!-- Payment Success Modal -->
            <div id="payment-success-modal" class="hidden fixed inset-0 bg-gray-800 bg-opacity-75 flex items-center justify-center z-50">
                <div class="bg-white p-8 rounded-lg text-center">
                    <svg class="w-16 h-16 text-green-500 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                    </svg>
                    <h3 class="text-2xl font-bold text-green-700 mb-4">Payment Successful!</h3>
                    <p class="text-green-700 mb-2">Thank you for your payment.</p>
                    <p class="text-green-700 font-semibold text-lg mb-4">Transaction ID: <span id="transaction-id" class="font-bold"></span></p>
                </div>
            </div>

            <!-- Error Container -->
            <div id="error-container" class="hidden mt-4">
                <div class="bg-red-100 border-l-4 border-red-500 text-red-700 p-4 rounded">
                    <p class="font-bold">Error</p>
                    <ul id="error-list"></ul>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const storedBookingData = localStorage.getItem('vehicleBookingData');
            
            if (!storedBookingData) {
                window.location.href = 'booking.html';
                return;
            }

            const bookingData = JSON.parse(storedBookingData);
            
            // Update summary section
            document.getElementById('summary-vehicle-type').textContent = bookingData.vehicleType.charAt(0).toUpperCase() + bookingData.vehicleType.slice(1);
            document.getElementById('summary-vehicle-model').textContent = bookingData.vehicleModel;
            document.getElementById('summary-rental-period').textContent = `${bookingData.formattedPickupDate} to ${bookingData.formattedReturnDate}`;
            document.getElementById('summary-duration').textContent = bookingData.durationDays;
            document.getElementById('price-breakdown').innerHTML = bookingData.priceBreakdown;
            document.getElementById('total-cost').textContent = bookingData.totalAmount.toLocaleString('en-IN');
            document.getElementById('pay-button-amount').textContent = bookingData.totalAmount.toLocaleString('en-IN');

            // Payment method toggle using buttons
            const paymentOptions = document.querySelectorAll('.payment-option');
            const cardFields = document.getElementById('card-payment-fields');
            const upiFields = document.getElementById('upi-payment-fields');
            const walletFields = document.getElementById('wallet-payment-fields');

            paymentOptions.forEach(option => {
                option.addEventListener('click', () => {
                    // Remove active class from all options
                    paymentOptions.forEach(opt => {
                        opt.classList.remove('active');
                    });
                    
                    // Add active class to clicked option
                    option.classList.add('active');
                    
                    // Check the radio button
                    const radio = option.querySelector('input[type="radio"]');
                    radio.checked = true;
                    
                    // Show/hide appropriate fields
                    const paymentMethod = radio.value;
                    
                    // Hide all payment fields first
                    cardFields.classList.add('hidden');
                    upiFields.classList.add('hidden');
                    walletFields.classList.add('hidden');

                    // Show the selected payment fields
                    if (paymentMethod === 'card') {
                        cardFields.classList.remove('hidden');
                    } else if (paymentMethod === 'upi') {
                        upiFields.classList.remove('hidden');
                    } else if (paymentMethod === 'wallet') {
                        walletFields.classList.remove('hidden');
                    }
                });
            });

            // Handle form submission
            document.getElementById('payment-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                
                document.getElementById('payment-processing-modal').classList.remove('hidden');
                
                try {
                    const formData = new FormData(e.target);
                    const paymentData = {
                        booking_id: bookingData.confirmationCode,
                        amount: bookingData.totalAmount,
                        payment_method: formData.get('payment_method'),
                        vehicle_type: bookingData.vehicleType,
                        vehicle_model: bookingData.vehicleModel,
                        pickup_date: bookingData.pickupDate,
                        return_date: bookingData.returnDate,
                        duration: bookingData.durationDays,
                        selected_services: bookingData.services
                    };

                    const response = await fetch('process-payment.php', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Accept': 'application/json'
                        },
                        body: JSON.stringify(paymentData)
                    });

                    if (!response.ok) {
                        throw new Error(`Payment failed with status: ${response.status}`);
                    }

                    const result = await response.json();
                    
                    if (result.success) {
                        document.getElementById('transaction-id').textContent = result.data.transaction_id;
                        document.getElementById('payment-processing-modal').classList.add('hidden');
                        document.getElementById('payment-success-modal').classList.remove('hidden');
                        localStorage.removeItem('vehicleBookingData');
                        
                        setTimeout(() => {
                            window.location.href = `booking-success.html?transaction_id=${result.data.transaction_id}`;
                        }, 2000);
                    } else {
                        throw new Error(result.message || 'Payment failed');
                    }
                } catch (error) {
                    document.getElementById('payment-processing-modal').classList.add('hidden');
                    document.getElementById('error-container').classList.remove('hidden');
                    document.getElementById('error-list').innerHTML = `<li>${error.message}</li>`;
                }
            });
        });
    </script>
</body>
</html>

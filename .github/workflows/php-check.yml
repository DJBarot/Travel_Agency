
name: PHP CI Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  php-check:
    name: Check PHP syntax
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Check PHP files
        shell: bash
        run: |
          set -e
          count=0
          while IFS= read -r -d '' file; do
            echo "Checking: $file"
            php -l "$file"
            count=$((count + 1))
          done < <(find . -type f -name '*.php' -not -path './.git/*' -print0)

          if [ "$count" -eq 0 ]; then
            echo "No PHP files found."
            exit 1
          fi

          echo "Successfully checked $count PHP file(s)."
